buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/public/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = "1.0"
group= "com.nikopet"
archivesBaseName = "NikoPet"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}

// ดักเปลี่ยนลิงก์ Amazon S3 ที่ตายแล้ว ให้มาใช้ลิงก์ปัจจุบันของ Mojang แทน
tasks.all { task ->
    if (task.name == 'downloadClient') {
        task.url = 'https://launcher.mojang.com/v1/objects/c4f2ebd9a36592206ae853aaa43f726621c1724b/client.jar'
    }
    if (task.name == 'downloadServer') {
        task.url = 'https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar'
    }
}

dependencies {
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
